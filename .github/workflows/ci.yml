name: CI Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Check ESLint (Syntax & Rules)
      run: npx eslint src/js/**/*.js || echo "Linting finished"

    - name: Check for direct console.log in Production JS
      run: |
        if grep -rn "console.log" src/js/ --exclude="config.js" --exclude="app.js" --exclude="utils/request.js"; then
          echo "Error: console.log should not be used directly in production files. Use log() from config.js instead."
          exit 1
        else
          echo "Console logging validation passed."
        fi
